# Example: serve the review page at /archive/ inside the server block that proxies Frigate,
# gated on Frigate's own login. nginx asks Frigate's /api/profile whether the browser's
# frigate_token cookie is valid; if not, the user is sent to Frigate's /login.
#
# Adjust:
#   - the two alias paths (page: install.sh --www-dir; data: ARCHIVE from the config)
#   - proxy_pass to however this nginx reaches Frigate's authenticated port (8971)
#
# Requires nginx built with ngx_http_auth_request_module (Debian/Ubuntu packages are).

    location = /archive { return 301 /archive/; }

    location /archive/ {
        auth_request /_archive_auth;
        error_page 401 = @archive_login;
        alias /usr/local/share/frigate-archive/www/;
        index index.html;
    }

    location /archive/data/ {
        auth_request /_archive_auth;
        error_page 401 = @archive_login;
        alias /mnt/frigate-archive/;
        gzip on;
        gzip_types application/json;                # the page's JSON compresses ~10x
    }

    # Export API (frigate-archive-tool serve, EXPORT_LISTEN). Optional: without it the page
    # just hides its Export button.
    location /archive/api/ {
        auth_request /_archive_auth;
        error_page 401 = @archive_login;
        proxy_pass http://127.0.0.1:8597/;
        client_max_body_size 16k;
    }

    location = /_archive_auth {
        internal;
        proxy_pass https://127.0.0.1:8971/api/profile;
        proxy_ssl_verify off;                      # Frigate's self-signed cert
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @archive_login { return 302 /login; }
